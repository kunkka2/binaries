name: Build typing app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout octotype source
        uses: actions/checkout@v4
        with:
          repository: mahlquistj/octotype
          ref: master
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target\release\*.exe dist\
          Copy-Item target\release\*.dll dist\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse assets\windows\* dist\ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: octotype-windows
          path: dist
          retention-days: 14